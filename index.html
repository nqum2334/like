<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>무드보드</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#ECEEF1;--paper:#FAFAFB;--ink:#20242E;--mute:#7B8190;--line:#D9DCE2;--accent:#5B6CC9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans KR',sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:0 auto;padding:32px 16px 80px}
h1{font-family:'Gowun Batang',serif;font-size:34px;margin:0}
.sub{color:var(--mute);font-size:14px;margin:6px 0 0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--paper);padding:8px 14px;border-radius:6px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
button.on{background:var(--accent);border-color:var(--accent);color:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=password],textarea{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:9px 12px;width:100%}
input[type=color]{width:44px;height:38px;border:1px solid var(--line);border-radius:6px;background:var(--paper);padding:2px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:16px;margin:20px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.row>input[type=text],.row>textarea{flex:1;min-width:150px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.top>div:first-child{flex:1;min-width:220px}
.ttl{font-family:'Gowun Batang',serif;font-weight:700;font-size:30px;border:0;background:transparent;width:100%;padding:0;outline:none}
.ttl:focus{border-bottom:1px solid var(--line)}
.status{font-size:13px;color:var(--mute)}
.err{color:#C0392B;font-size:14px;margin-top:8px;min-height:18px}
#wrap{position:relative;width:100%;overflow:hidden;border:1px solid var(--line);border-radius:6px;margin-top:14px}
#stage{position:absolute;left:0;top:0;width:1600px;height:1000px;transform-origin:0 0;overflow:hidden}
.item{position:absolute;user-select:none;-webkit-user-select:none}
.editing .item{cursor:move;touch-action:none}
.editing .item *{pointer-events:none}
.item.sel{outline:2px solid var(--accent)}
.hd{display:none;position:absolute;width:22px;height:22px;background:#fff;border:2px solid var(--accent);border-radius:50%;z-index:99999}
.editing .item.sel .hd{display:block;pointer-events:auto}
.hd.rs{right:-12px;bottom:-12px;cursor:nwse-resize;touch-action:none}
.hd.rt{left:calc(50% - 11px);top:-36px;cursor:grab;touch-action:none}
.color{display:flex;align-items:flex-end;padding:10px;font-size:13px;font-weight:500;border-radius:4px}
.item img{width:100%;height:100%;object-fit:cover;display:block;border-radius:4px}
.note{padding:14px;font-family:'Gowun Batang',serif;font-size:20px;line-height:1.5;overflow:hidden;background:rgba(255,255,255,.85);border-radius:4px;word-break:keep-all}
.tag{display:flex;align-items:center;justify-content:center;border-radius:999px;background:var(--paper);border:1px solid var(--line);font-size:16px}
.yt{background-size:cover;background-position:center;position:relative;border-radius:4px;overflow:hidden;color:#fff}
.yt .cap{position:absolute;left:0;right:0;bottom:0;padding:8px 10px;font-size:13px;background:linear-gradient(transparent,rgba(0,0,0,.7))}
.yt .play{position:absolute;left:calc(50% - 24px);top:calc(50% - 24px);width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.92);color:var(--ink);display:grid;place-items:center}
.item iframe{width:100%;height:100%;border:0;display:block;border-radius:4px}
.lnk{display:flex;flex-direction:column;justify-content:center;gap:4px;padding:14px;background:var(--paper);border:1px solid var(--line);border-radius:4px;color:var(--ink);text-decoration:none;font-size:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:6px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<script>
/* ★ Apps Script 웹 앱 배포 URL(…/exec)을 여기에 붙여 넣으세요 */
const API_URL = 'https://script.google.com/macros/s/AKfycbyloJuUXu359GcPIuXfu1eurSzFbdGK1dzF6CZmIcO1eFLi1RyMSA3p1QRXjcIEonlg/exec';

const $app = document.getElementById('app');
const W = 1600, H = 1000;
let boardId = '', pw = '', title = '', items = [], bg = {type:'color',c1:'#F3F4F6'};
let recoveryCode = '', mode = 'edit', selected = null, tab = 'color', saveTimer = null, scale = 1;

const el = (tag, props = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') n.className = v;
    else if (k === 'style') n.style.cssText = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  kids.flat().forEach(c => n.append(c));
  return n;
};
const $ = id => document.getElementById(id);
const uid = () => Math.random().toString(36).slice(2, 9);
const isHttp = u => /^https?:\/\//i.test(u);
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }
async function api(body){
  const r = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body)});
  return r.json();
}
function copy(text){
  const done=()=>toast('복사했어요');
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(()=>prompt('복사해서 쓰세요',text));
  else prompt('복사해서 쓰세요',text);
}

/* ---------- 입장 화면 ---------- */
const urlId = (new URLSearchParams(location.search).get('id')||'').replace(/[^a-z0-9]/g,'');
renderHome();

function renderHome(){
  const msg = el('div',{class:'err'});
  const idIn = el('input',{type:'text',placeholder:'보드 주소 또는 ID',value:urlId});
  const pwIn = el('input',{type:'password',placeholder:'비밀번호',autocomplete:'current-password'});
  const enter = el('button',{class:'primary',onclick:async()=>{
    const id=(idIn.value.match(/[?&]id=([a-z0-9]+)/)||[,idIn.value.trim()])[1].replace(/[^a-z0-9]/g,'');
    if(!id||!pwIn.value) return msg.textContent='ID와 비밀번호를 입력해 주세요.';
    await openBoard(id,pwIn.value,msg,enter);
  }},'입장');
  pwIn.addEventListener('keydown',e=>{if(e.key==='Enter')enter.click();});

  const nt = el('input',{type:'text',placeholder:'무드보드 이름',maxlength:'60'});
  const np = el('input',{type:'password',placeholder:'비밀번호 (4자 이상)',autocomplete:'new-password'});
  const msg2 = el('div',{class:'err'});
  const make = el('button',{class:'primary',onclick:async()=>{
    make.disabled=true; make.textContent='만드는 중…';
    try{
      const r=await api({action:'create',title:nt.value.trim(),password:np.value});
      if(!r.ok){msg2.textContent=r.error;return;}
      recoveryCode=r.recovery;
      history.replaceState(null,'','?id='+r.id);
      await openBoard(r.id,np.value,msg2,make);
    }catch(e){msg2.textContent='서버에 연결하지 못했어요.';}
    finally{make.disabled=false;make.textContent='만들기';}
  }},'만들기');

  const rid = el('input',{type:'text',placeholder:'보드 ID',value:urlId});
  const rc = el('input',{type:'text',placeholder:'복구 코드'});
  const rn = el('input',{type:'password',placeholder:'새 비밀번호 (4자 이상)',autocomplete:'new-password'});
  const msg3 = el('div',{class:'err'});
  const rb = el('button',{class:'primary',onclick:async()=>{
    rb.disabled=true; msg3.style.color='';
    try{
      const r=await api({action:'reset',id:rid.value.trim().replace(/[^a-z0-9]/g,''),recovery:rc.value.trim().toLowerCase(),newPassword:rn.value});
      if(!r.ok){msg3.textContent=r.error;return;}
      msg3.style.color='#2E7D32'; msg3.textContent='비밀번호를 바꿨어요. 위에서 입장해 주세요.';
    }catch(e){msg3.textContent='서버에 연결하지 못했어요.';}
    finally{rb.disabled=false;}
  }},'비밀번호 바꾸기');

  $app.replaceChildren(
    el('h1',{},'무드보드'),
    el('p',{class:'sub'},'좋아하는 색, 사진, 노래를 자유롭게 놓고 비밀번호로 나눠 보세요.'),
    el('div',{class:'card'},el('b',{},'입장하기'),el('div',{class:'row'},idIn),el('div',{class:'row'},pwIn,enter),msg),
    el('div',{class:'card'},el('b',{},'새 보드 만들기'),el('div',{class:'row'},nt),el('div',{class:'row'},np,make),msg2),
    el('details',{class:'card'},el('summary',{},'비밀번호를 잊었어요'),el('p',{class:'sub'},'보드를 만들 때 받은 복구 코드로 새 비밀번호를 정할 수 있어요.'),el('div',{class:'row'},rid),el('div',{class:'row'},rc),el('div',{class:'row'},rn,rb),msg3)
  );
}

async function openBoard(id,password,msgEl,btn){
  if(btn){btn.disabled=true;}
  try{
    const r=await api({action:'open',id,password});
    if(!r.ok){ if(msgEl) msgEl.textContent=r.error; return; }
    boardId=id; pw=password; title=r.title; items=r.items||[]; bg=r.bg&&r.bg.type?r.bg:{type:'color',c1:'#F3F4F6'};
    mode='edit'; selected=null; renderBoard();
  }catch(e){ if(msgEl) msgEl.textContent='서버에 연결하지 못했어요.'; }
  finally{ if(btn) btn.disabled=false; }
}

/* ---------- 보드 화면 ---------- */
function renderBoard(){
  const t = el('input',{class:'ttl',type:'text',value:title,maxlength:'60','aria-label':'보드 이름',oninput:e=>{title=e.target.value;queueSave();}});
  const modeBtn = el('button',{onclick:()=>{mode=mode==='edit'?'view':'edit';selected=null;renderBoard();}},mode==='edit'?'보기 모드':'편집 모드');
  $app.replaceChildren(
    recoveryCode ? el('div',{class:'card'},el('b',{},'복구 코드: '+recoveryCode),el('p',{class:'sub'},'비밀번호를 잊으면 이 코드가 필요해요. 지금만 보여 드리니 꼭 저장해 두세요.'),el('div',{class:'row'},el('button',{onclick:()=>copy(recoveryCode)},'코드 복사'),el('button',{class:'primary',onclick:()=>{recoveryCode='';renderBoard();}},'저장했어요'))) : '',
    el('div',{class:'top'},
      el('div',{},t,el('p',{class:'status',id:'status'},'')),
      el('div',{class:'row',style:'margin:0'},
        modeBtn,
        el('button',{onclick:()=>copy(location.origin+location.pathname+'?id='+boardId)},'링크 복사'),
        el('button',{onclick:()=>{history.replaceState(null,'',location.pathname);pw='';renderHome();}},'나가기'))),
    mode==='edit' ? el('div',{class:'card',id:'panel'}) : '',
    el('div',{id:'sel',class:'row'}),
    el('div',{id:'wrap'},el('div',{id:'stage'}))
  );
  if(mode==='edit') renderPanel();
  fit(); renderStage(); renderSel();
}
function fit(){
  const wrap=$('wrap'); scale=Math.min(1,wrap.clientWidth/W);
  $('stage').style.transform='scale('+scale+')'; wrap.style.height=(H*scale)+'px';
}
window.addEventListener('resize',()=>{ if($('wrap')) fit(); });

function applyBg(){
  const s=$('stage'); if(!s) return;
  if(bg.type==='gradient') s.style.background='linear-gradient('+(bg.angle||135)+'deg,'+bg.c1+','+(bg.c2||'#FFFFFF')+')';
  else if(bg.type==='image'&&bg.url) s.style.background='#ddd url("'+bg.url.replace(/["()\\]/g,'')+'") center/cover no-repeat';
  else s.style.background=bg.c1||'#F3F4F6';
}

/* ---------- 패널 ---------- */
function renderPanel(){
  const labels={color:'색',image:'사진',song:'노래',note:'글귀',tag:'태그',bg:'배경'};
  const tabs=el('div',{class:'tabs'},Object.entries(labels).map(([k,v])=>el('button',{class:tab===k?'on':'',onclick:()=>{tab=k;renderPanel();}},v)));
  let body;
  if(tab==='color'){
    const c=el('input',{type:'color',value:'#5B6CC9','aria-label':'색 선택'});
    body=el('div',{class:'row'},c,el('button',{class:'primary',onclick:()=>add({type:'color',value:c.value.toUpperCase(),w:150,h:150})},'색 추가'));
  }else if(tab==='image'){
    const u=el('input',{type:'text',placeholder:'이미지 주소 (https://…)'});
    const f=()=>{ if(!isHttp(u.value.trim())) return toast('https로 시작하는 주소를 넣어 주세요'); add({type:'image',value:u.value.trim(),w:260,h:260}); u.value=''; };
    u.addEventListener('keydown',e=>{if(e.key==='Enter')f();});
    body=el('div',{class:'row'},u,el('button',{class:'primary',onclick:f},'사진 추가'));
  }else if(tab==='song'){
    const u=el('input',{type:'text',placeholder:'유튜브 또는 스포티파이 링크'});
    const n=el('input',{type:'text',placeholder:'곡명 · 가수 (선택)'});
    body=el('div',{class:'row'},u,n,el('button',{class:'primary',onclick:()=>{
      const v=u.value.trim(); if(!isHttp(v)) return toast('링크를 넣어 주세요');
      const sp=/open\.spotify\.com/.test(v);
      add({type:'song',value:v,title:n.value.trim(),w:sp?340:320,h:sp?152:180}); u.value='';n.value='';
    }},'노래 추가'));
  }else if(tab==='note'){
    const t=el('textarea',{rows:'2',maxlength:'200',placeholder:'좋아하는 문장이나 메모'});
    body=el('div',{class:'row'},t,el('button',{class:'primary',onclick:()=>{ if(!t.value.trim())return; add({type:'note',value:t.value.trim(),w:240,h:150}); t.value=''; }},'글귀 추가'));
  }else if(tab==='tag'){
    const t=el('input',{type:'text',maxlength:'20',placeholder:'키워드 (예: 새벽, 청량)'});
    const f=()=>{ if(!t.value.trim())return; add({type:'tag',value:t.value.trim(),w:Math.max(80,t.value.trim().length*18+40),h:38}); t.value=''; };
    t.addEventListener('keydown',e=>{if(e.key==='Enter')f();});
    body=el('div',{class:'row'},t,el('button',{class:'primary',onclick:f},'태그 추가'));
  }else{
    body=bgPanel();
  }
  $('panel').replaceChildren(tabs,body);
}
function bgPanel(){
  const set=(p)=>{ bg={...bg,...p}; applyBg(); queueSave(); };
  const types=el('div',{class:'tabs'},[['color','단색'],['gradient','그라데이션'],['image','이미지']].map(([k,v])=>
    el('button',{class:bg.type===k?'on':'',onclick:()=>{ bg={...bg,type:k}; if(k==='gradient'&&!bg.c2)bg.c2='#C9D3FF'; applyBg(); queueSave(); renderPanel(); }},v)));
  const c1=el('input',{type:'color',value:bg.c1||'#F3F4F6','aria-label':'색 1',oninput:e=>set({c1:e.target.value.toUpperCase()})});
  let rest;
  if(bg.type==='color') rest=el('div',{class:'row'},c1);
  else if(bg.type==='gradient'){
    const c2=el('input',{type:'color',value:bg.c2||'#C9D3FF','aria-label':'색 2',oninput:e=>set({c2:e.target.value.toUpperCase()})});
    const a=el('input',{type:'range',min:'0',max:'360',value:String(bg.angle||135),'aria-label':'각도',oninput:e=>set({angle:+e.target.value})});
    rest=el('div',{class:'row'},c1,c2,el('span',{class:'sub'},'각도'),a);
  }else{
    const u=el('input',{type:'text',placeholder:'배경 이미지 주소 (https://…)',value:bg.url||''});
    rest=el('div',{class:'row'},u,el('button',{class:'primary',onclick:()=>{ const v=u.value.trim(); if(v&&!isHttp(v))return toast('https로 시작하는 주소를 넣어 주세요'); set({url:v}); }},'적용'));
  }
  return el('div',{},el('div',{class:'row'},types),rest);
}

/* ---------- 아이템 ---------- */
function add(it){
  const n=items.length;
  Object.assign(it,{id:uid(),x:100+(n%8)*45,y:90+(n%8)*35,r:0,z:nextZ()});
  items.push(it); selected=it.id; renderStage(); renderSel(); queueSave();
}
const nextZ=()=>items.reduce((m,i)=>Math.max(m,i.z||0),0)+1;
const minZ=()=>items.reduce((m,i)=>Math.min(m,i.z||0),0)-1;

function renderStage(){
  const s=$('stage'); if(!s) return;
  s.className=mode==='edit'?'editing':'';
  s.replaceChildren(...items.map(mk));
  applyBg();
  if(mode==='edit') s.onpointerdown=e=>{ if(e.target===s){selected=null;renderStage();renderSel();} };
}
function lum(hex){ const n=parseInt((hex||'#fff').slice(1),16); return (0.299*((n>>16)&255)+0.587*((n>>8)&255)+0.114*(n&255))/255; }

function mk(it){
  const d=el('div',{class:'item'+(selected===it.id&&mode==='edit'?' sel':''),style:style(it)});
  d.dataset.id=it.id;
  if(it.type==='color'){ d.classList.add('color'); d.style.background=it.value; d.style.color=lum(it.value)<.5?'#fff':'#20242E'; d.append(it.value); }
  else if(it.type==='image'){ const im=el('img',{src:it.value,alt:'',draggable:'false',referrerpolicy:'no-referrer'}); im.onerror=()=>im.replaceWith(el('div',{class:'note',style:'font-size:14px;color:#7B8190'},'사진을 불러올 수 없어요')); d.append(im); }
  else if(it.type==='note'){ d.classList.add('note'); d.append(it.value); }
  else if(it.type==='tag'){ d.classList.add('tag'); d.append(it.value); }
  else song(d,it);
  if(mode==='edit'){
    d.addEventListener('pointerdown',e=>{ if(e.target.classList.contains('hd'))return; e.preventDefault(); select(it.id,d); startDrag(e,it,d,'move'); });
    d.append(el('div',{class:'hd rs',onpointerdown:e=>{e.stopPropagation();e.preventDefault();startDrag(e,it,d,'resize');}}),
             el('div',{class:'hd rt',onpointerdown:e=>{e.stopPropagation();e.preventDefault();startDrag(e,it,d,'rotate');}}));
  }
  return d;
}
function style(it){ return 'left:'+it.x+'px;top:'+it.y+'px;width:'+it.w+'px;height:'+it.h+'px;transform:rotate('+(it.r||0)+'deg);z-index:'+(it.z||0); }

function song(d,it){
  const yt=it.value.match(/(?:youtu\.be\/|v=|\/embed\/|\/shorts\/)([\w-]{11})/);
  const sp=it.value.match(/open\.spotify\.com\/(?:intl-[a-z]+\/)?(track|album|playlist|episode)\/(\w+)/);
  if(yt){
    d.classList.add('yt'); d.style.backgroundImage='url(https://img.youtube.com/vi/'+yt[1]+'/hqdefault.jpg)';
    d.append(el('div',{class:'play'},'▶'),el('div',{class:'cap'},it.title||'유튜브'));
    if(mode==='view') d.addEventListener('click',()=>{ d.replaceChildren(el('iframe',{src:'https://www.youtube.com/embed/'+yt[1]+'?autoplay=1',allow:'autoplay; encrypted-media',allowfullscreen:''})); },{once:true});
  }else if(sp){
    d.append(el('iframe',{src:'https://open.spotify.com/embed/'+sp[1]+'/'+sp[2],allow:'encrypted-media',loading:'lazy'}));
  }else{
    d.append(el('a',{class:'lnk',href:it.value,target:'_blank',rel:'noopener',style:'height:100%'},el('b',{},it.title||'노래 링크'),el('span',{class:'sub'},it.value.slice(0,50))));
  }
}

function select(id,d){
  if(selected===id) return;
  selected=id; document.querySelectorAll('.item.sel').forEach(n=>n.classList.remove('sel')); d.classList.add('sel'); renderSel();
}
function renderSel(){
  const box=$('sel'); if(!box) return;
  const it=items.find(i=>i.id===selected);
  if(!it||mode!=='edit'){ box.replaceChildren(); box.style.margin='0'; return; }
  box.style.margin='';
  box.replaceChildren(
    el('span',{class:'sub'},'선택한 항목'),
    el('button',{onclick:()=>{it.z=nextZ();renderStage();queueSave();}},'맨 앞으로'),
    el('button',{onclick:()=>{it.z=minZ();renderStage();queueSave();}},'맨 뒤로'),
    el('button',{onclick:()=>{it.r=0;renderStage();queueSave();}},'회전 초기화'),
    el('button',{onclick:()=>{items=items.filter(i=>i.id!==it.id);selected=null;renderStage();renderSel();queueSave();}},'삭제'));
}
window.addEventListener('keydown',e=>{
  if(mode!=='edit'||!selected||['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;
  if(e.key==='Delete'||e.key==='Backspace'){ items=items.filter(i=>i.id!==selected); selected=null; renderStage(); renderSel(); queueSave(); }
});

function startDrag(e,it,d,kind){
  const sx=e.clientX, sy=e.clientY, x0=it.x, y0=it.y, w0=it.w, h0=it.h, rad=(it.r||0)*Math.PI/180;
  const rect=d.getBoundingClientRect(), cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
  const move=ev=>{
    const dx=(ev.clientX-sx)/scale, dy=(ev.clientY-sy)/scale;
    if(kind==='move'){ it.x=Math.round(Math.max(-it.w+40,Math.min(W-40,x0+dx))); it.y=Math.round(Math.max(-it.h+40,Math.min(H-40,y0+dy))); }
    else if(kind==='resize'){
      const lx=dx*Math.cos(rad)+dy*Math.sin(rad), ly=-dx*Math.sin(rad)+dy*Math.cos(rad);
      it.w=Math.round(Math.max(40,w0+lx)); it.h=Math.round(Math.max(30,h0+ly));
    }else{ it.r=Math.round(Math.atan2(ev.clientY-cy,ev.clientX-cx)*180/Math.PI+90); }
    d.style.cssText=style(it);
  };
  const up=()=>{ window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up); window.removeEventListener('pointercancel',up); queueSave(); };
  window.addEventListener('pointermove',move); window.addEventListener('pointerup',up); window.addEventListener('pointercancel',up);
}

/* ---------- 저장 ---------- */
function queueSave(){
  const s=$('status'); if(s) s.textContent='저장 중…';
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{
      const r=await api({action:'save',id:boardId,password:pw,title,items,bg});
      const s2=$('status'); if(s2) s2.textContent=r.ok?'저장됨':r.error;
    }catch(e){ const s2=$('status'); if(s2) s2.textContent='저장 실패. 잠시 후 다시 시도해 주세요'; }
  },800);
}

if(urlId && API_URL.startsWith('http')){ /* 링크로 들어오면 ID가 채워진 입장 화면이 보여요 */ }
